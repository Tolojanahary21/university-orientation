[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orientation-ml"
version = "0.1.0"
description = "Pipeline ML de l'orientation universitaire"
requires-python = ">=3.14"
dynamic = ["dependencies"]

[project.scripts]
orientation-ml = "orientation_ml.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
